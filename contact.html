<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Payal Chat</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Trebuchet MS', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('img/wooden2.avif');
            background-attachment: fixed;
            background-size: cover;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .contact-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #FFD700;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        p {
            color: #ccc;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            color: #FF8C00;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #FFD700;
            background: rgba(0, 0, 0, 0.5);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #8B0000, #FF4500);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 69, 0, 0.4);
        }

        .info-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 0.9rem;
        }

        .info-footer span {
            color: #FFD700;
            display: block;
            margin-top: 5px;
        }

        .back-home {
            display: inline-block;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .back-home:hover { color: #FFD700; }
    </style>
</head>
<body>

    <div class="contact-container">
        <h1>Contact <span style="color:#FF4500">Us</span></h1>
        <p>Have a question or a catering request? Drop us a message!</p>
        
        <form action="#">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea rows="4" placeholder="How can we help you?" required></textarea>
            </div>
            <button type="submit" class="submit-btn" onclick="alert('Message Sent!')">Send Message</button>
        </form>

        <div class="info-footer">
            📍 Food Court Behind 34 block, LPU, Punjab, India, 144411
            <span>📞 +91 739000 81958</span>
        </div>

        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

</body>
</html>
